<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>加班/休息标记日历</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/calendar.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/progress.css">
    <link rel="stylesheet" href="css/themes.css">
    <!-- 网站图标 -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
    <!-- PWA manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>

<body>
    <div class="app-container">

        <!-- ===== 左侧面板 ===== -->
        <div class="side-panel" id="leftPanel">
            <div class="panel-title">📊 本月统计</div>

            <div class="stat-card">
                <div class="stat-icon overtime-icon">🌙</div>
                <div class="stat-info">
                    <div class="stat-label">加班</div>
                    <div class="stat-number overtime-num" id="overtimeCount">0</div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon rest-icon">☀️</div>
                <div class="stat-info">
                    <div class="stat-label">休息</div>
                    <div class="stat-number rest-num" id="restCount">0</div>
                </div>
            </div>

            <hr class="divider">

            <div class="progress-section" id="progressSection">
                <div class="progress-header">
                    <span class="progress-label">🎯 基础目标</span>
                    <span class="progress-count">
                        <span class="done" id="progressDone">0</span>
                        <span class="target">/ <span id="progressTarget">14</span></span>
                    </span>
                </div>
                <div class="progress-bar-track">
                    <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
                </div>
                <div class="progress-status" id="progressStatus">⏳ 进行中...</div>
            </div>

            <div class="progress-section extra-section" id="extraProgressSection">
                <div class="progress-header">
                    <span class="progress-label">⭐ 额外加班</span>
                    <span class="progress-count">
                        <span class="done" id="extraDone">0</span>
                        <span class="target">/ <span id="extraTarget">8</span></span>
                    </span>
                </div>
                <div class="progress-bar-track">
                    <div class="progress-bar-fill" id="extraFill" style="width:0%"></div>
                </div>
                <div class="progress-status" id="extraStatus">⏳ 进行中...</div>
            </div>

            <hr class="divider">

            <!-- ===== 倒计时模块 ===== -->
            <div
                style="background:rgba(248,250,252,0.7);border-radius:16px;padding:10px 18px;border:none;min-height:80px;display:flex;flex-direction:column;">
                <div
                    style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;padding-bottom:6px;border-bottom:2px solid rgba(226,232,240,0.6);">
                    <span
                        style="font-size:0.7rem;font-weight:700;color:#94a3b8;letter-spacing:0.5px;text-transform:uppercase;">⏱️
                        倒计时</span>
                    <span id="addCountdownBtn"
                        style="font-size:0.65rem;color:#3b82f6;cursor:pointer;transition:0.2s;padding:0 4px;font-weight:500;"
                        onmouseover="this.style.color='#2563eb'" onmouseout="this.style.color='#3b82f6'">✚ 添加</span>
                </div>
                <div id="countdownList" style="flex:1;min-height:40px;">
                    <div style="font-size:0.65rem;color:#94a3b8;text-align:center;padding:8px 0;">暂无倒计时，点击 ✚ 添加</div>
                </div>
            </div>
        </div>

        <!-- ===== 日历主区域 ===== -->
        <div class="calendar-wrapper" id="app">
            <div class="calendar-header">
                <div class="month-year" id="monthYearDisplay">2026年7月</div>
                <div class="nav-group">
                    <button class="nav-btn arrow-btn" id="prevMonthBtn"></button>
                    <button class="nav-btn today-btn" id="todayBtn">📌 今天</button>
                    <button class="nav-btn arrow-btn" id="nextMonthBtn"></button>
                </div>
            </div>

            <div class="weekdays">
                <div>一</div>
                <div>二</div>
                <div>三</div>
                <div>四</div>
                <div>五</div>
                <div>六</div>
                <div>日</div>
            </div>

            <div class="days-grid" id="daysGrid"></div>

            <!-- ===== 底部操作栏 ===== -->
            <div class="footer-bar">
                <div
                    style="display:flex; gap:6px; align-items:center; font-size:0.7rem; color:#94a3b8; flex-wrap:wrap;">
                    <span>💡 点击切换</span>
                    <span style="opacity:0.3;">|</span>
                    <span>🔄 拖拽批量</span>
                    <span style="opacity:0.3;">|</span>
                    <span id="exportData" style="font-size:0.6rem;color:#94a3b8;cursor:pointer;transition:0.2s;"
                        onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color='#94a3b8'">💾
                        导出</span>
                    <span style="font-size:0.5rem;color:#e2e8f0;">|</span>
                    <span id="importData" style="font-size:0.6rem;color:#94a3b8;cursor:pointer;transition:0.2s;"
                        onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color='#94a3b8'">📂
                        导入</span>
                </div>
                <div class="action-group">
                    <button class="action-btn clear-btn" id="clearMonthBtn">🗑️ 清除</button>
                    <button class="action-btn overtime-btn" id="markOvertimeBtn" draggable="true">🌙 加班</button>
                    <button class="action-btn rest-btn" id="markRestBtn" draggable="true">☀️ 休息</button>
                </div>
            </div>
            <div id="toastMessage" class="toast-message">💾 数据自动保存 · 拖拽按钮到日期可批量标记</div>
        </div>

        <!-- ===== 右侧面板 ===== -->
        <div class="side-panel right" id="rightPanel">
            <div class="panel-title">📋 快速操作</div>

            <div class="info-card" style="cursor:pointer;" id="quickToday">
                <span class="icon">📍</span>
                <span>跳转到今天</span>
                <span class="hint" id="todayDateDisplay">点击跳转</span>
            </div>

            <div class="info-card" style="cursor:pointer;" id="quickClear">
                <span class="icon">🧹</span>
                <span>清除本月</span>
                <span class="hint">清空所有标记</span>
            </div>
<!-- ===== 主题色（超小版，无标题） ===== -->
            <div style="display:flex;gap:4px;justify-content:center;padding:4px 0;">
                <span data-theme="default" class="theme-dot" style="display:inline-block;width:18px;height:18px;border-radius:50%;background:#3b82f6;cursor:pointer;border:2px solid #e2e8f0;transition:0.2s;" title="默认蓝" onclick="setTheme('default')"></span>
                <span data-theme="red" class="theme-dot" style="display:inline-block;width:18px;height:18px;border-radius:50%;background:#ef4444;cursor:pointer;border:2px solid #e2e8f0;transition:0.2s;" title="红色" onclick="setTheme('red')"></span>
                <span data-theme="orange" class="theme-dot" style="display:inline-block;width:18px;height:18px;border-radius:50%;background:#f59e0b;cursor:pointer;border:2px solid #e2e8f0;transition:0.2s;" title="橙色" onclick="setTheme('orange')"></span>
                <span data-theme="green" class="theme-dot" style="display:inline-block;width:18px;height:18px;border-radius:50%;background:#22c55e;cursor:pointer;border:2px solid #e2e8f0;transition:0.2s;" title="绿色" onclick="setTheme('green')"></span>
                <span data-theme="purple" class="theme-dot" style="display:inline-block;width:18px;height:18px;border-radius:50%;background:#8b5cf6;cursor:pointer;border:2px solid #e2e8f0;transition:0.2s;" title="紫色" onclick="setTheme('purple')"></span>
                <span data-theme="pink" class="theme-dot" style="display:inline-block;width:18px;height:18px;border-radius:50%;background:#ec4899;cursor:pointer;border:2px solid #e2e8f0;transition:0.2s;" title="粉色" onclick="setTheme('pink')"></span>
                <span data-theme="cyan" class="theme-dot" style="display:inline-block;width:18px;height:18px;border-radius:50%;background:#06b6d4;cursor:pointer;border:2px solid #e2e8f0;transition:0.2s;" title="青色" onclick="setTheme('cyan')"></span>
                <span data-theme="gray" class="theme-dot" style="display:inline-block;width:18px;height:18px;border-radius:50%;background:#6b7280;cursor:pointer;border:2px solid #e2e8f0;transition:0.2s;" title="灰色" onclick="setTheme('gray')"></span>
            </div>
            <!-- ===== 主题选择器 ===== -->
            <!-- <div style="padding:8px 0;">
                <div style="font-size:0.65rem;font-weight:600;color:#94a3b8;letter-spacing:0.5px;margin-bottom:6px;">🎨 主题色</div>
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                    <span data-theme="default" class="theme-dot" style="display:inline-block;width:28px;height:28px;border-radius:50%;background:#3b82f6;cursor:pointer;border:2px solid #e2e8f0;transition:0.2s;" title="默认蓝" onclick="setTheme('default')"></span>
                    <span data-theme="red" class="theme-dot" style="display:inline-block;width:28px;height:28px;border-radius:50%;background:#ef4444;cursor:pointer;border:2px solid #e2e8f0;transition:0.2s;" title="红色" onclick="setTheme('red')"></span>
                    <span data-theme="orange" class="theme-dot" style="display:inline-block;width:28px;height:28px;border-radius:50%;background:#f59e0b;cursor:pointer;border:2px solid #e2e8f0;transition:0.2s;" title="橙色" onclick="setTheme('orange')"></span>
                    <span data-theme="green" class="theme-dot" style="display:inline-block;width:28px;height:28px;border-radius:50%;background:#22c55e;cursor:pointer;border:2px solid #e2e8f0;transition:0.2s;" title="绿色" onclick="setTheme('green')"></span>
                    <span data-theme="purple" class="theme-dot" style="display:inline-block;width:28px;height:28px;border-radius:50%;background:#8b5cf6;cursor:pointer;border:2px solid #e2e8f0;transition:0.2s;" title="紫色" onclick="setTheme('purple')"></span>
                    <span data-theme="pink" class="theme-dot" style="display:inline-block;width:28px;height:28px;border-radius:50%;background:#ec4899;cursor:pointer;border:2px solid #e2e8f0;transition:0.2s;" title="粉色" onclick="setTheme('pink')"></span>
                    <span data-theme="cyan" class="theme-dot" style="display:inline-block;width:28px;height:28px;border-radius:50%;background:#06b6d4;cursor:pointer;border:2px solid #e2e8f0;transition:0.2s;" title="青色" onclick="setTheme('cyan')"></span>
                    <span data-theme="gray" class="theme-dot" style="display:inline-block;width:28px;height:28px;border-radius:50%;background:#6b7280;cursor:pointer;border:2px solid #e2e8f0;transition:0.2s;" title="灰色" onclick="setTheme('gray')"></span>
                </div>
            </div> -->

            <hr class="divider">

            <!-- ===== 天气模块 ===== -->
            <div style="flex:1; min-height:0; display:flex; flex-direction:column;">
                <div
                    style="font-size:0.7rem;font-weight:700;color:#475569;letter-spacing:0.5px;padding-bottom:8px;border-bottom:2px solid #e9edf3;display:flex;justify-content:space-between;align-items:center;">
                    <span>🌤️ 今日天气</span>
                    <span id="weatherRefresh" style="font-size:0.55rem;color:#94a3b8;cursor:pointer;font-weight:400;">🔄
                        刷新</span>
                </div>
                <div id="weatherDisplay"
                    style="flex:1;padding-top:10px;display:flex;flex-direction:column;gap:6px;justify-content:center;">
                    <div style="font-size:0.8rem;color:#94a3b8;text-align:center;padding:12px 0;">⏳ 加载中...</div>
                </div>
            </div>

            <!-- ===== 问候语 ===== -->
            <div id="greetingContainer" style="border-top:1px solid #f1f4f9;padding-top:10px;margin-top:4px;">
                <div id="greetingDisplay"
                    style="font-size:1.1rem;font-weight:700;color:#0f172a;text-align:center;margin-bottom:4px;letter-spacing:0.5px;">
                    ☀️ 上午好
                </div>
            </div>

            <!-- ===== 当前时间 ===== -->
            <div style="border-top:1px solid #f1f4f9;padding-top:10px;margin-top:4px;">
                <div id="clockDisplay"
                    style="font-size:1rem;font-weight:600;color:#0f172a;text-align:center;letter-spacing:1px;">
                    --:--:--
                </div>
                <div style="font-size:0.55rem;color:#94a3b8;text-align:center;margin-top:2px;">
                    <span id="dateDisplay">----年--月--日</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== 加载 JavaScript ========== -->
    <script src="js/lunar-data/lunar-2026.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/dragDrop.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/countdown.js"></script>
    <script src="js/main.js"></script>

    <!-- 注册 Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(function (reg) {
                    console.log('✅ Service Worker 注册成功');
                })
                .catch(function (err) {
                    console.log('❌ Service Worker 注册失败:', err);
                });
        }
    </script>
</body>

</html>
