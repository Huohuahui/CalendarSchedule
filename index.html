<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">

    <!-- ===== 基础 SEO ===== -->
    <title>排班日历 · 加班休息标记与月度目标进度</title>
    <meta name="description"
        content="免费开源的排班日历：点击即可标记加班与休息，追踪每月基础目标与额外加班进度。支持自定义大月/小月目标、农历节气、待办提醒、未来 6 天天气与离线使用。纯本地运行，数据只存本机、不上传服务器。">
    <meta name="keywords" content="排班日历,加班日历,倒班排班,休息记录,月度目标,农历节气,排班表,考勤记录,离线日历">
    <meta name="author" content="Huohuahui">
    <meta name="robots" content="index,follow">
    <link rel="canonical" href="https://huohuahui.github.io/CalendarSchedule/">

    <!-- ===== 社交分享（Open Graph / Twitter） ===== -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="排班日历">
    <meta property="og:locale" content="zh_CN">
    <meta property="og:title" content="排班日历 · 加班休息标记与月度目标进度">
    <meta property="og:description"
        content="点击标记加班与休息，追踪每月目标进度。可自定义排班规则、带农历节气与待办提醒，纯本地运行、打开即用、可离线。">
    <meta property="og:url" content="https://huohuahui.github.io/CalendarSchedule/">
    <meta property="og:image" content="https://huohuahui.github.io/CalendarSchedule/icons/icon-512.png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="排班日历 · 加班休息标记与月度目标进度">
    <meta name="twitter:description"
        content="点击标记加班与休息，追踪每月目标进度。可自定义排班规则、带农历节气与待办提醒，纯本地运行、打开即用、可离线。">
    <meta name="twitter:image" content="https://huohuahui.github.io/CalendarSchedule/icons/icon-512.png">

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/calendar.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/progress.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/todo.css">
    <link rel="stylesheet" href="css/backup.css">
    <!-- 网站图标 -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
    <!-- iOS 添加到主屏的图标（SVG favicon 在 iOS 上不生效） -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <!-- PWA manifest -->
    <link rel="manifest" href="pwa/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#3b82f6">

    <!-- ===== 结构化数据（帮助搜索引擎理解这是什么应用） ===== -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "排班日历",
        "alternateName": "加班/休息标记日历",
        "url": "https://huohuahui.github.io/CalendarSchedule/",
        "description": "免费开源的排班日历：标记每天的加班与休息，追踪每月基础目标与额外加班进度，支持自定义排班规则、农历节气、待办提醒、天气与离线使用。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Web (任何现代浏览器)",
        "inLanguage": "zh-CN",
        "isAccessibleForFree": true,
        "license": "https://opensource.org/licenses/MIT",
        "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "CNY"
        },
        "featureList": [
            "加班与休息日历标记",
            "可定制的月度目标与排班方案",
            "农历、节气与传统节日",
            "待办事项与临近提醒",
            "倒计时",
            "未来 6 天天气（自动定位或手动选城市）",
            "数据本地备份与导出",
            "多主题配色",
            "离线可用（PWA）"
        ]
    }
    </script>
</head>

<body>
    <div class="app-container">

        <!-- ===== 左侧面板 ===== -->
        <div class="side-panel" id="leftPanel">
            <div class="panel-title">📊 本月统计</div>

            <div class="stat-card">
                <div class="stat-icon overtime-icon">🌙</div>
                <div class="stat-info">
                    <div class="stat-label">加班</div>
                    <div class="stat-number overtime-num" id="overtimeCount">0</div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon rest-icon">☀️</div>
                <div class="stat-info">
                    <div class="stat-label">休息</div>
                    <div class="stat-number rest-num" id="restCount">0</div>
                </div>
            </div>

            <hr class="divider">

            <div class="progress-section" id="progressSection">
                <div class="progress-header">
                    <span class="progress-label">🎯 基础目标</span>
                    <span class="progress-count">
                        <span class="done" id="progressDone">0</span>
                        <span class="target">/ <span id="progressTarget">14</span></span>
                    </span>
                </div>
                <div class="progress-bar-track">
                    <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
                </div>
                <div class="progress-status" id="progressStatus">⏳ 进行中...</div>
            </div>

            <div class="progress-section extra-section" id="extraProgressSection">
                <div class="progress-header">
                    <span class="progress-label">⭐ 额外加班</span>
                    <span class="progress-count">
                        <span class="done" id="extraDone">0</span>
                        <span class="target">/ <span id="extraTarget">8</span></span>
                    </span>
                </div>
                <div class="progress-bar-track">
                    <div class="progress-bar-fill" id="extraFill" style="width:0%"></div>
                </div>
                <div class="progress-status" id="extraStatus">⏳ 进行中...</div>
            </div>

            <hr class="divider">

            <!-- ===== 排班方案入口（目标天数可定制） ===== -->
            <div class="plan-entry-bar" id="planEntry" tabindex="0" role="button" title="定制排班方案：大月/小月目标与额外上限都能改">
                <span class="plan-entry-icon">🧭</span>
                <span class="plan-entry-name" id="planEntryHint">标准班</span>
                <span class="plan-entry-go">定制 ›</span>
            </div>

            <!-- ===== 倒计时模块 ===== -->
            <div class="countdown-module">
                <div class="countdown-header">
                    <span class="countdown-title">⏱️ 倒计时</span>
                    <span id="addCountdownBtn" class="countdown-add" tabindex="0" role="button">✚ 添加</span>
                </div>
                <div id="countdownList" class="countdown-list">
                    <div class="countdown-empty">暂无倒计时，点击 ✚ 添加</div>
                </div>
            </div>
        </div>

        <!-- ===== 日历主区域 ===== -->
        <div class="calendar-wrapper" id="app">
            <div class="calendar-header">
                <div class="month-year" id="monthYearDisplay">2026年7月</div>
                <div class="nav-group">
                    <button class="nav-btn" id="prevMonthBtn" aria-label="上一月"></button>
                    <button class="nav-btn today-btn" id="todayBtn">📌 今天</button>
                    <button class="nav-btn" id="nextMonthBtn" aria-label="下一月"></button>
                </div>
            </div>

            <div class="weekdays">
                <div>一</div>
                <div>二</div>
                <div>三</div>
                <div>四</div>
                <div>五</div>
                <div>六</div>
                <div>日</div>
            </div>

            <div class="days-grid" id="daysGrid"></div>

            <!-- ===== 底部操作栏 ===== -->
            <div class="footer-bar">
                <div class="footer-hints">
                    <span id="undoBtn" class="footer-link" tabindex="0" role="button" title="撤销上一步（Ctrl+Z）">↩︎ 撤销</span>
                    <span class="hint-sep">·</span>
                    <span id="backupBtn" class="footer-link" tabindex="0" role="button" title="备份 / 恢复数据">💾 备份</span>
                    <span class="hint-sep">·</span>
                    <span id="importBtn" class="footer-link" tabindex="0" role="button" title="从备份文件导入">📂 导入</span>
                </div>
                <div class="action-group">
                    <button class="action-btn clear-btn" id="clearMonthBtn">🗑️ 清除</button>
                    <button class="action-btn multi-btn" id="multiSelectBtn">☑️ 多选</button>
                    <button class="action-btn overtime-btn" id="markOvertimeBtn" draggable="true">🌙 加班</button>
                    <button class="action-btn rest-btn" id="markRestBtn" draggable="true">☀️ 休息</button>
                </div>
            </div>
            <div id="toastMessage" class="toast-message">💾 数据自动保存 · 拖拽按钮到日期可批量标记</div>

            <!-- ===== 页脚信息：居中两行，贴在日历盒子最底部（填掉两侧栏更高时留下的空白） ===== -->
            <div class="app-footer">
                <span class="app-footer-line">排班日历 v1.0 · MIT 开源许可</span>
                <span class="app-footer-line">
                    <a id="aboutLink" href="pages/about.html">关于</a>
                    <span class="hint-sep">·</span>
                    <a id="privacyLink" href="pages/privacy.html">隐私政策</a>
                </span>
            </div>
        </div>

        <!-- ===== 右侧面板 ===== -->
        <div class="side-panel right" id="rightPanel">
            <div class="panel-title">📋 快速操作</div>

            <!-- 四项快速操作排成 2×2 宫格，图标在左文字在右，尽量压缩高度 -->
            <div class="quick-actions">
                <div class="info-card" id="quickTodo" tabindex="0" role="button" title="打开待办事项总览">
                    <span class="icon">📝</span>
                    <span class="text-wrap">
                        <span class="name">待办</span>
                        <span class="hint" id="todoBadge">点击查看</span>
                    </span>
                </div>

                <div class="info-card" id="quickClear" tabindex="0" role="button" title="清空本月的所有标记">
                    <span class="icon">🧹</span>
                    <span class="text-wrap">
                        <span class="name">清除</span>
                        <span class="hint">清空本月</span>
                    </span>
                </div>

                <div class="info-card" id="quickTemplate" tabindex="0" role="button" title="套用排班模板（上五休二等）">
                    <span class="icon">📋</span>
                    <span class="text-wrap">
                        <span class="name">模板</span>
                        <span class="hint" id="quickTemplateHint">一键套用</span>
                    </span>
                </div>

                <div class="info-card" id="quickCopyPrev" tabindex="0" role="button" title="把上个月的排班复制到本月">
                    <span class="icon">📄</span>
                    <span class="text-wrap">
                        <span class="name">复制</span>
                        <span class="hint">上月排班</span>
                    </span>
                </div>
            </div>

            <!-- ===== 主题色（超小版，圆点由 themes.js 生成） ===== -->
            <div id="themeDots" class="theme-dots-row"></div>

            <hr class="divider">

            <!-- ===== 天气模块 ===== -->
            <div class="weather-module">
                <div class="weather-header">
                    <span class="weather-loc" id="weatherLocBtn" tabindex="0" role="button" title="点击切换城市">
                        🌤️ <span id="weatherLocName">定位中…</span><span class="weather-loc-caret">▾</span>
                    </span>
                    <span id="weatherRefresh" class="weather-refresh" tabindex="0" role="button" title="刷新天气">🔄 刷新</span>
                </div>
                <div id="weatherDisplay" class="weather-body">
                    <div class="weather-loading">⏳ 加载中...</div>
                </div>
            </div>

            <!-- ===== 问候语 ===== -->
            <div class="greeting-module">
                <div id="greetingDisplay" class="greeting-text">☀️ 上午好</div>
            </div>

            <!-- ===== 当前时间 ===== -->
            <div class="clock-module">
                <div id="clockDisplay" class="clock-text">--:--:--</div>
                <div class="clock-date">
                    <span id="dateDisplay">----年--月--日</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== 加载 JavaScript ========== -->
    <!-- 农历算法库（lunar-javascript，约 300KB，本地 + 离线缓存，不阻塞渲染） -->
    <script src="js/error-log.js" defer></script>
    <script src="js/lunar.min.js" defer></script>
    <script src="js/utils.js" defer></script>
    <script src="js/analytics.js" defer></script>
    <script src="js/overlay.js" defer></script>
    <script src="js/modal.js" defer></script>
    <script src="js/storage.js" defer></script>
    <script src="js/history.js" defer></script>
    <script src="js/progress.js" defer></script>
    <script src="js/calendar.js" defer></script>
    <script src="js/dragDrop.js" defer></script>
    <script src="js/themes.js" defer></script>
    <script src="js/countdown.js" defer></script>
    <script src="js/templates.js" defer></script>
    <script src="js/plan.js" defer></script>
    <script src="js/todo.js" defer></script>
    <script src="js/todo-reminder.js" defer></script>
    <script src="js/weather-location.js" defer></script>
    <script src="js/backup.js" defer></script>
    <script src="js/cloud-config.js" defer></script>
    <script src="js/cloud-backup.js" defer></script>
    <script src="js/main.js" defer></script>

    <!-- 注册 Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(function (reg) {
                    console.log('✅ Service Worker 注册成功');
                })
                .catch(function (err) {
                    console.log('❌ Service Worker 注册失败:', err);
                });
        }
    </script>
</body>

</html>
